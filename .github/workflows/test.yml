name: test

on:
  push:
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lld
      - run: npm test
      - run: cmake -S native/rgi -B build/rgi -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/rgi
      - run: ctest --test-dir build/rgi --output-on-failure
      - run: sh native/delphi-qnx/build.sh
      - run: sh native/delphi-qnx/verify.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0867d-native-research-payload
          path: |
            native/delphi-qnx/build/libmst2_nar_ipod.so
            native/delphi-qnx/build/libmst2_nar_launch.so
          if-no-files-found: error

